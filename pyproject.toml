[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-kit"
version = "0.1.0"
description = "Project memory recall for coding agents: the few most relevant notes for a prompt, from your own docs."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "recall-kit contributors"}]
keywords = ["claude-code", "hook", "mcp", "memory", "recall", "notes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
recall = "recall_kit:main"

[tool.setuptools]
py-modules = ["recall_kit"]
